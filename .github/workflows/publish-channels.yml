# ============================================================
#  RPM 仓库发布工作流
#  触发条件：在 GitHub 手动将 draft release 点击 "Publish" 后自动运行
# ============================================================

name: Publish RPM Repo

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  rpm-repo:
    name: 📦 更新 RPM 仓库
    runs-on: ubuntu-latest
    if: "!github.event.release.prerelease"
    steps:
      - name: Checkout 主分支
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout rpm-repo 分支
        uses: actions/checkout@v4
        with:
          ref: rpm-repo
          path: repo
          fetch-depth: 0

      - name: 下载 RPM 包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd repo
          mkdir -p rpm-repo
          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --pattern '*.rpm' --dir rpm-repo

      - name: 更新仓库元数据
        run: |
          cd repo
          sudo apt-get update
          sudo apt-get install -y createrepo-c
          cd rpm-repo
          createrepo_c --update .
          cd ..
          # 同步仓库配置文件
          cp main/packaging/rpm/embedcalc.repo .

      - name: 提交并推送
        run: |
          cd repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "RPM 仓库无变化，跳过提交"
          else
            git commit -m "Update RPM packages for ${{ github.event.release.tag_name }}"
            git push
          fi
