# ============================================================
#  RPM 仓库发布工作流
#  触发条件：在 GitHub 手动将 draft release 点击 "Publish" 后自动运行
# ============================================================

name: Publish RPM Repo

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  rpm-repo:
    name: 📦 更新 RPM 仓库
    runs-on: ubuntu-latest
    if: "!github.event.release.prerelease"
    steps:
      - name: Checkout 主分支
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout rpm-repo 分支
        uses: actions/checkout@v4
        with:
          ref: rpm-repo
          path: repo
          fetch-depth: 0

      - name: 下载 RPM 包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd repo
          mkdir -p rpm-repo
          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --pattern '*.rpm' --dir rpm-repo

      - name: 导入 GPG 私钥
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # 信任导入的密钥（ultimate trust）
          KEY_ID=$(gpg --list-keys --keyid-format long | grep -A1 '^pub' | tail -1 | awk '{print $1}')
          echo "${KEY_ID}:6:" | gpg --import-ownertrust

      - name: 更新仓库元数据
        run: |
          cd repo
          sudo apt-get update
          sudo apt-get install -y createrepo-c
          cd rpm-repo
          createrepo_c --update .
          cd ..
          # 同步仓库配置文件（main/ 是 repo/ 的兄弟目录）
          cp ../main/packaging/rpm/embedcalc.repo .

      - name: 签名仓库元数据并导出公钥
        run: |
          cd repo/rpm-repo
          # 签名 repomd.xml
          gpg --batch --yes --detach-sign --armor repodata/repomd.xml
          # 导出公钥供用户导入
          gpg --export --armor > repodata/repomd.xml.key

      - name: 提交并推送
        run: |
          cd repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "RPM 仓库无变化，跳过提交"
          else
            git commit -m "Update RPM packages for ${{ github.event.release.tag_name }}"
            git push
          fi
